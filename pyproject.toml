[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dec"
version = "0.1.0"
description = "Capa de decisión sobre decision models abiertos"
requires-python = ">=3.11,<3.12"
license = {text = "PolyForm-Noncommercial-1.0.0"}
dependencies = [
  "numpy>=2.0",
  "torch>=2.6",
  "transformers>=5.19,<6",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "pyarrow>=15",
  "datasets>=2.21",
  "huggingface_hub>=0.26",
  "sentence-transformers>=3.3",
  "faiss-cpu>=1.8",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "tqdm>=4.66",
  "loguru>=0.7",
  "safetensors>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-timeout>=2.3", "ruff>=0.5"]
fast = ["flash-linear-attention>=0.5"]   # kernels rápidos para Qwen3.5 / JevK5 (opcional)

[project.scripts]
dec-eval = "dec.eval.cli:main"
dec-serve = "dec.serve.app:main"
dec-pool = "dec.pool:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 600
pythonpath = ["."]
markers = ["slow: usa modelos reales (MiniLM, Qwen3-0.6B); en GPU o en CPU según el test"]
